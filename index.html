<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badminton Rotation Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=20" />
  </head>
  <body>
    <button id="themeToggle" type="button" class="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
      <span aria-hidden="true">☀</span><span aria-hidden="true">☾</span>
    </button>
    <main class="shell">
      <section class="card form-card">
        <h1>Badminton Rotation</h1>
        <p class="subtitle">Generate games until partnership repetition starts.</p>

        <label for="playersInput">Player names (one per line)</label>
        <textarea id="playersInput" rows="10" placeholder="A\nB\nC\nD\nE\nF"></textarea>

        <div id="knownPlayersChips" class="chips"></div>

        <div class="court-view-settings">
          <span id="courtViewLabel" class="court-view-label">Court view</span>
          <div class="court-view-toggle" role="radiogroup" aria-labelledby="courtViewLabel">
            <input id="courtViewEnd" name="courtView" type="radio" value="end" checked />
            <label for="courtViewEnd">Back view</label>
            <input id="courtViewSide" name="courtView" type="radio" value="side" />
            <label for="courtViewSide">Sideline</label>
          </div>
        </div>

        <div class="actions">
          <button id="startBtn" type="button">Start</button>
          <button id="nextSetBtn" type="button" class="ghost" disabled>New Set</button>
          <button id="demoBtn" type="button" class="ghost">Load Demo</button>
        </div>

        <div class="actions nav-actions">
          <button id="prevSetBtn" type="button" class="ghost mini" disabled>◀ Previous</button>
          <span id="setIndicator" class="hint" style="margin:0; align-self:center;">No sets yet</span>
          <button id="viewNextSetBtn" type="button" class="ghost mini" disabled>Next ▶</button>
        </div>

        <div class="actions">
          <button id="resetSeasonBtn" type="button" class="mini">Reset Season</button>
        </div>

        <p id="errorText" class="error" aria-live="polite"></p>
      </section>

      <section class="card output-card">
        <div class="output-head">
          <h2>Schedule</h2>
          <button id="resetCurrentSetBtn" type="button" class="ghost mini" disabled>Reset Current Set</button>
        </div>
        <p id="metaText" class="meta">Enter player names and click Start.</p>
        <p class="hint">Select a game to score it.</p>
        <div id="output"></div>
      </section>
    </main>

    <script src="app.js?v=28"></script>
  </body>
</html>
