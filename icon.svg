    <line x1="217.2" y1="294.3" x2="61.8" y2="111.3" />
    <line x1="228.9" y1="286.5" x2="120.3" y2="72.5" />
    <line x1="241.9" y1="281.7" x2="185.8" y2="48.3" />
    <line x1="256.0" y1="280.0" x2="256.0" y2="40.0" />
    <line x1="270.0" y1="281.7" x2="326.2" y2="48.3" />
    <line x1="283.1" y1="286.5" x2="391.7" y2="72.5" />
    <line x1="294.8" y1="294.3" x2="450.2" y2="111.3" />
  </g>

  <!-- Cork -->
  <circle cx="256" cy="340" r="79" fill="#f2a30f" />
</svg>
