<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Badminton Rotation">
  <defs>
    <linearGradient id="court" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#1bc47d" />
      <stop offset="1" stop-color="#035f38" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#court)" />

  <!-- Feather skirt -->
  <path d="M187 340 L105 118 Q100 74 256 74 Q412 74 407 118 L325 340 Z" fill="#ffffff" />

  <!-- Feather separations, painted with the background gradient so they read as gaps -->
